version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-linktree
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:/app/prisma/dev.db}
      # JWT_SECRET burada TANIMLANMAZ: kurulum sihirbazı ./.env dosyasına yazar ve uygulama açılışta
      # oradan okur. Burada boş tanımlamak .env'deki değeri ezer (her yeniden başlatmada oturumlar
      # ve bültendeki "abonelikten çık" linkleri geçersiz olurdu).
    volumes:
      - db-data:/app/prisma
      - uploads:/app/public/uploads
      # Kurulum sihirbazının yazdığı ayarlar (JWT_SECRET). İlk çalıştırmadan önce `touch .env` ile
      # boş dosya oluşturun; yoksa Docker bunu klasör olarak oluşturur ve ayar kaydedilemez.
      - ./.env:/app/.env
    # localhost Alpine'de ::1'e gidebilir; Next.js yalnızca IPv4'te dinliyor
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - linktree-network

volumes:
  db-data:
    driver: local
  uploads:
    driver: local

networks:
  linktree-network:
    driver: bridge
