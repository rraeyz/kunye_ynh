# Next.js görsel optimizasyon ucu kullanılmıyor (görseller önceden küçültülüyor); bilinen DoS açıkları yüzünden kapalı
location __PATH__/_next/image {
    return 404;
}

# /admin yolu - Yunohost SSO bypass (uygulama kendi auth'unu yapıyor)
location __PATH__/admin {
    proxy_pass http://127.0.0.1:__PORT__/admin;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    client_max_body_size 50M;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    proxy_buffering off;
    proxy_request_buffering off;
    
    client_max_body_size 50M;
    
    # Timeout settings
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
}
