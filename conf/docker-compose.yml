services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: __APP__
    restart: unless-stopped
    ports:
      # Sadece yerel arayüz: nginx 127.0.0.1 üzerinden bağlanır. Tüm arayüzlere açılırsa Docker
      # YunoHost güvenlik duvarını atlar ve uygulama nginx/HTTPS olmadan doğrudan erişilebilir olur.
      - "127.0.0.1:__PORT__:3000"
    env_file:
      - __DATA_DIR__/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXT_PUBLIC_BASE_URL=https://__DOMAIN____PATH__
    volumes:
      - __DATA_DIR__/prisma:/app/prisma
      - __DATA_DIR__/uploads:/app/public/uploads
      - __DATA_DIR__/.env:/app/.env
    # localhost Alpine'de ::1'e gidebilir; Next.js yalnızca IPv4'te dinliyor
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - linktree-network

networks:
  linktree-network:
    driver: bridge
